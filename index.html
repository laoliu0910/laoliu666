<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ef">
  <meta name="description" content="把某一天的阳光、笑容和心动，轻轻收藏起来。">
  <title>把日子过成诗 · 一段旅程</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f7f4ef;--ink:#292722;--muted:#77736b;--accent:#a76f62;--line:#ded9d0}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans","Noto Serif SC",serif}
    .wrap{width:min(1180px,calc(100% - 48px));margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;padding:28px 0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
    .brand{color:var(--ink);text-decoration:none;letter-spacing:.12em}.hero{min-height:530px;display:grid;grid-template-columns:1.02fr .98fr;align-items:center;gap:7%;padding:42px 0 82px}
    .eyebrow{font:500 11px "DM Sans",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(42px,6vw,78px);font-weight:400;line-height:1.22;letter-spacing:.04em;margin:24px 0}h1 em{font-style:normal;color:var(--accent)}
    .lead{font-size:16px;line-height:2.1;color:#656159;letter-spacing:.07em}.poem{margin:32px 0 0;padding-left:18px;border-left:1px solid #c9a69c;color:#77736b;font-size:14px;line-height:2.1;letter-spacing:.08em}
    .hero-image{position:relative;padding:0 0 34px 34px}.hero-image:before{content:"";position:absolute;left:0;bottom:0;width:72%;height:70%;background:#e7dfd5}.hero-image img{position:relative;display:block;width:100%;height:500px;object-fit:cover;object-position:center 48%;box-shadow:0 18px 50px #342b2418}.image-note{position:absolute;right:-14px;bottom:7px;writing-mode:vertical-rl;font-size:10px;letter-spacing:.2em;color:var(--muted)}
    .section-head{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:17px;margin-bottom:34px}.section-head h2{font-size:23px;font-weight:400;letter-spacing:.12em;margin:0}.section-head span{font:11px "DM Sans",sans-serif;color:var(--muted);letter-spacing:.14em}.gallery{padding:18px 0 96px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:56px 36px}.card:nth-child(2){margin-top:90px}.card img{display:block;width:100%;height:570px;object-fit:cover;background:#e9e3dc;cursor:zoom-in;transition:transform .5s,box-shadow .5s}.card img:hover{transform:translateY(-4px);box-shadow:0 20px 45px #342b2418}.card:nth-child(3){grid-column:1 / -1;width:72%;margin:0 auto}.card:nth-child(3) img{height:650px;object-position:center 40%}.caption{display:flex;justify-content:space-between;padding:15px 2px 0;color:var(--muted);font-size:11px;letter-spacing:.14em}.caption strong{font:400 14px "Noto Serif SC",serif;color:var(--ink);letter-spacing:.12em}
    .closing{border-top:1px solid var(--line);text-align:center;padding:70px 0 86px}.closing p{margin:0;font-size:clamp(20px,3vw,30px);line-height:1.9;letter-spacing:.12em}.closing small{display:block;margin-top:25px;color:var(--muted);font-size:10px;letter-spacing:.24em}.footer{padding:20px 0 30px;display:flex;justify-content:space-between;color:#8a857c;font-size:10px;letter-spacing:.12em;border-top:1px solid var(--line)}
    .lightbox{position:fixed;inset:0;background:#171613ed;z-index:5;display:none;align-items:center;justify-content:center;padding:24px}.lightbox.open{display:flex}.lightbox img{max-width:min(90vw,1050px);max-height:90vh;object-fit:contain}.close{position:absolute;right:28px;top:20px;border:0;background:none;color:white;font-size:32px;cursor:pointer}
    @media(max-width:760px){.wrap{width:min(100% - 34px,560px)}.topbar{padding:20px 0}.hero{grid-template-columns:1fr;gap:38px;padding:45px 0 60px;min-height:unset}.hero-copy{order:0}.hero-image{order:1;padding:0 0 22px 20px}.hero-image img{height:420px}.image-note{right:-5px}.lead{font-size:14px}.poem{margin-top:23px}.cards{grid-template-columns:1fr;gap:40px}.card:nth-child(2){margin-top:0}.card img{height:auto;max-height:680px;aspect-ratio:4/5}.card:nth-child(3){grid-column:auto;width:100%}.card:nth-child(3) img{height:auto;aspect-ratio:4/5}.section-head{margin-bottom:24px}.gallery{padding-bottom:62px}.closing{padding:55px 0 65px}}
  </style>
</head>
<body>
  <header class="wrap topbar"><a class="brand" href="#top">小朋友的旅程</a><span>记下相遇的风景</span></header>
  <main id="top" class="wrap">
    <section class="hero">
      <div class="hero-copy">
        <div class="eyebrow">A little day to remember · 2025.06.30</div>
        <h1>把日子<br><em>过成诗</em></h1>
        <p class="lead">有些风景，因为你在，<br>便有了值得珍藏的模样。</p>
        <blockquote class="poem">风从旧砖墙边经过，<br>阳光落在裙摆与笑意之间。<br>这一刻不必匆忙，<br>慢慢走，也慢慢喜欢。</blockquote>
      </div>
      <div class="hero-image"><img src="assets/photo-1.jpg" alt="红砖墙前，笑着张开双臂的旅行瞬间"><span class="image-note">把快乐留在这一页</span></div>
    </section>
    <section class="gallery" aria-labelledby="gallery-title">
      <div class="section-head"><h2 id="gallery-title">旅途里的片刻</h2><span>THREE MOMENTS, ONE STORY</span></div>
      <div class="cards">
        <article class="card"><img src="assets/photo-2.jpg" alt="红砖巷子里温柔的笑容" loading="lazy"><div class="caption"><strong>红砖巷的回声</strong><span>01 / 03</span></div></article>
        <article class="card"><img src="assets/photo-3.jpg" alt="绿意与雕塑相伴的城市一角" loading="lazy"><div class="caption"><strong>绿荫下的午后</strong><span>02 / 03</span></div></article>
        <article class="card"><img src="assets/photo-1.jpg" alt="在老墙边舒展双臂，收藏此刻的快乐" loading="lazy"><div class="caption"><strong>风也替我说喜欢</strong><span>03 / 03</span></div></article>
      </div>
    </section>
    <section class="closing"><p>愿往后的每一程，<br>都有风景，也有好心情。</p><small>THE BEAUTY IS IN THE LITTLE THINGS</small></section>
  </main>
  <footer class="wrap footer"><span>一段被认真收藏的旅程</span><span>JUNE · 2025</span></footer>
  <div class="lightbox" role="dialog" aria-modal="true" aria-label="照片预览"><button class="close" aria-label="关闭">×</button><img alt="照片放大预览"></div>
  <script>
    const box=document.querySelector('.lightbox'),preview=box.querySelector('img');
    document.querySelectorAll('.card img').forEach(img=>img.addEventListener('click',()=>{preview.src=img.src;preview.alt=img.alt;box.classList.add('open')}));
    box.addEventListener('click',e=>{if(e.target===box||e.target.classList.contains('close'))box.classList.remove('open')});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')box.classList.remove('open')});
  </script>
</body>
</html>
